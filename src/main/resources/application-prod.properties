# ============================================
# CONFIGURATION PRODUCTION - GESTION COURRIER
# ============================================
spring.application.name=gestioncourrier
server.port=8080
 
# ============================================
# BASE DE DONNÉES (Neon PostgreSQL)
# ============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
 
# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#avant
#spring.jpa.hibernate.ddl-auto=validate
# Après
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
 
# ============================================
# POOL DE CONNEXIONS HikariCP (réduit pour plan gratuit)
# ============================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=false
 
# ============================================
# SÉCURITÉ JWT
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
spring.security.oauth2.resourceserver.jwt.secret-key=${jwt.secret}
 
# ============================================
# EMAIL
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
sendgrid.api.key=${SENDGRID_API_KEY}
spring.mail.from=inseedmail@gmail.com
 
# ============================================
# CORS (URL Vercel frontend)
# ============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
 
# ============================================
# FRONTEND URL
# ============================================
app.frontend.url=${FRONTEND_URL}
 
# ============================================
# UPLOADS FICHIERS
# ============================================
courrier.upload.dir=uploads/courriers
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
 
# ============================================
# DATES / JACKSON
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Africa/Lome
spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=non_null
 
# ============================================
# LOGGING (minimal en production)
# ============================================
logging.level.tg.inseed.gestioncourrier=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.file.name=logs/gestioncourrier.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
 
# ============================================
# ACTUATOR (MONITORING)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
 
# ============================================
# OPENAPI / SWAGGER
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
 
# ============================================
# SESSIONS (désactivé - stateless JWT)
# ============================================
spring.session.jdbc.initialize-schema=never
spring.session.store-type=none
 
# ============================================
# VALIDATION ET ERREURS
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
 
# ============================================
# DEVTOOLS (désactivés en production)
# ============================================
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false