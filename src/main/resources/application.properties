# URL de connexion à la base de données PostgreSQL
spring.application.name=gestioncourrier
server.port=8097
spring.datasource.url=jdbc:postgresql://localhost:5432/courrierfinal

# Identifiants de connexion 
spring.datasource.username=postgres
spring.datasource.password=lavendave585

# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Activation Des logs de validation Spring
server.error.include-message=always
server.error.include-binding-errors=always

#Pour la Date 

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Désactive la conversion automatique des noms
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============================================
# CONFIGURATION LOGGING
# ============================================

# Niveau de log pour ton package principal
logging.level.tg.inseed.gestioncourrier=INFO

# Logs détaillés pour Spring Security (utile pour le debug des filtres et authentification)
logging.level.org.springframework.security=DEBUG

# Affiche les requêtes SQL exécutées par Hibernate
logging.level.org.hibernate.SQL=DEBUG

# Affiche les valeurs des paramètres SQL (très utile pour le debug)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Fichier de sortie des logs
logging.file.name=logs/gestioncourrier.log

# Format des lignes de log dans le fichier
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ============================================
# CONFIGURATION SPRING BOOT ACTUATOR (MONITORING)
# ============================================

# Endpoints exposés pour le monitoring
management.endpoints.web.exposure.include=health,info,metrics

# Affiche les détails de santé dans /actuator/health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# ============================================
# CONFIGURATION SPRING DOC OPENAPI (DOCUMENTATION)
# ============================================

# Endpoint JSON de la documentation OpenAPI
springdoc.api-docs.path=/api-docs

# URL de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Trie les opérations par méthode HTTP
springdoc.swagger-ui.operationsSorter=method

# Trie les tags par ordre alphabétique
springdoc.swagger-ui.tagsSorter=alpha

# ============================================
# CONFIGURATION CORS (DÉVELOPPEMENT)
# ============================================

# Origines autorisées pour les appels frontend (React, Angular)
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200

# Méthodes HTTP autorisées
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Headers autorisés
app.cors.allowed-headers=*

# Autorise l’envoi de cookies et headers d’authentification
app.cors.allow-credentials=true

# ============================================
# CONFIGURATION SPRING BOOT DEVTOOLS (DÉVELOPPEMENT)
# ============================================

# Active le rechargement automatique du navigateur (LiveReload)
spring.devtools.livereload.enabled=true

# Redémarre l’application automatiquement en cas de modification
spring.devtools.restart.enabled=true

# ============================================
# CONFIGURATION DU POOL DE CONNEXIONS HikariCP
# ============================================

# Taille maximale du pool de connexions
spring.datasource.hikari.maximum-pool-size=20

# Nombre minimum de connexions inactives gardées prêtes
spring.datasource.hikari.minimum-idle=5

# Timeout pour fermer une connexion inactive (en ms)
spring.datasource.hikari.idle-timeout=300000

# Timeout pour obtenir une connexion (en ms)
spring.datasource.hikari.connection-timeout=20000

# Durée de vie maximale d’une connexion (en ms)
spring.datasource.hikari.max-lifetime=1200000

# ============================================
# CONFIGURATION JPA/HIBERNATE
# ============================================





# Formatage lisible des requêtes SQL
spring.jpa.properties.hibernate.format_sql=true

# Création des LOB sans contexte JDBC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true



# Optimisations JPA pour les performances
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# ============================================
# CONFIGURATION SÉCURITÉ JWT
# ============================================

# Clé secrète utilisée pour signer les tokens JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A472D4B6150645367566B5970

# Durée de vie du token JWT (1 jour en ms)
jwt.expiration=86400000

# Durée de vie du refresh token (7 jours en ms)
jwt.refresh-expiration=604800000

# Utilisation de la clé JWT dans Spring Security (OAuth2 Resource Server)
spring.security.oauth2.resourceserver.jwt.secret-key=${jwt.secret}

# ============================================
# CONFIGURATION SESSIONS SPRING (DÉSACTIVÉ)
# ============================================

# Désactive la création automatique des tables de session
spring.session.jdbc.initialize-schema=never

# Désactive complètement le stockage des sessions (stateless via JWT)
spring.session.store-type=none

# ============================================
# CONFIGURATION VALIDATION ET ERREURS
# ============================================



# Ne pas inclure la stacktrace dans les erreurs (sécurité)
server.error.include-stacktrace=never

# Ne pas inclure le nom de l’exception dans les erreurs
server.error.include-exception=false

# Lève une exception si aucune route ne correspond
spring.mvc.throw-exception-if-no-handler-found=true

# Désactive les mappings automatiques des ressources statiques
spring.web.resources.add-mappings=false

# ============================================
# CONFIGURATION JSON/JACKSON
# ============================================

# Fuseau horaire utilisé pour les dates
spring.jackson.time-zone=Africa/Lome

# JSON indenté pour plus de lisibilité
spring.jackson.serialization.indent_output=true

# Ignore les propriétés nulles dans les objets JSON
spring.jackson.default-property-inclusion=non_null

spring.datasource.hikari.auto-commit=false

